name: Import Hizlisatis POS source
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/archive.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack project
        run: |
          base64 -d bootstrap/archive.b64 > /tmp/hizlisatis.tar.zst
          echo 'f4ce541a5b1d6224da464000b458c631b4f5f43df047638bc6235e6850016e26  /tmp/hizlisatis.tar.zst' | sha256sum -c -
          zstd -d -c /tmp/hizlisatis.tar.zst | tar -xf -
          rm -rf bootstrap
      - name: Push actual source files to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish Hizlisatis mobile POS PWA'
            git push
          fi
