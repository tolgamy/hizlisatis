name: Bootstrap Hizlisatis
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/part-04.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble and verify deployment source
        run: |
          cat bootstrap/part-{01,02,03,04}.txt | base64 -d > /tmp/hizlisatis.tar.zst
          echo 'f4ce541a5b1d6224da464000b458c631b4f5f43df047638bc6235e6850016e26  /tmp/hizlisatis.tar.zst' | sha256sum -c -
          zstd -d -c /tmp/hizlisatis.tar.zst | tar -xvf -
          rm -rf bootstrap
      - name: Commit unpacked app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'feat: add Hizlisatis mobile POS PWA source' && git push)
