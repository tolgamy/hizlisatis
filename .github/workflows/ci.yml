name: POS PWA – Build and Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Verify source and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build offline scanner asset
        run: npm run build
      - name: Check required Pages files
        run: |
          test -f public/index.html
          test -f public/manifest.json
          test -f public/sw.js
          test -s public/vendor/html5-qrcode.min.js
          test ! -e functions/api/products.js
          test -f public/catalog/manifest.json
          test -f public/image-delivery.js
          test -f functions/api/image.js
          node -e "const m=require('./public/catalog/manifest.json');if(m.count!==19096||m.withImages!==14525)process.exit(1)"
