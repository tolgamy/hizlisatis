name: Central D1 production readiness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-production-readiness.yml'
      - 'public/index.html'
      - 'functions/api/product-state.js'
  pull_request:
    paths:
      - 'functions/api/product-state.js'
      - 'public/idb.js'
      - 'public/remote-products.js'
      - '.github/workflows/d1-production-readiness.yml'
jobs:
  verify-central-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify live Pages D1 catalog count without credentials
        shell: bash
        run: |
          set -euo pipefail
          # Central POS is live only when the updated web shell AND API agree.
          for attempt in $(seq 1 6); do
            # The old HTML semver label was removed years ago. Detect the
            # deployed service-worker shell instead of grepping the HTML.
            shell="$(curl -L --connect-timeout 8 --max-time 12 -fsS 'https://hizlisatis.pages.dev/sw.js' || true)"
            payload="$(curl --connect-timeout 8 --max-time 12 -fsS 'https://hizlisatis.pages.dev/api/product-state?health=1' || true)"
            images="$(curl --connect-timeout 8 --max-time 12 -fsS 'https://hizlisatis.pages.dev/api/category-images' || true)"
            version="$(printf '%s' "$shell" | grep -oE 'cep-pos-shell-v[0-9]+' | head -n 1 | sed 's/cep-pos-shell-v//' || true)"
            sample="$(printf '%s' "$payload" | head -c 140 || true)"
            echo "Live check $attempt: shell_version=${version:-not-found}; API_response=${sample:-empty}"
            if [ -n "$version" ] && [ "$version" -ge 32 ] &&
               [ -n "$payload" ] && [ -n "$images" ] &&
               printf '%s\n%s' "$payload" "$images" | node -e '
                 let raw="";process.stdin.on("data",x=>raw+=x);
                 process.stdin.on("end",()=>{
                   try{
                     const [product,category]=raw.trim().split("\n").map(JSON.parse);
                     process.exit(product.ready===true&&product.count>=19096&&
                       category.images&&typeof category.images==="object"&&!Array.isArray(category.images)?0:1);
                   }catch{process.exit(1)}
                 });
               '; then
              echo "Central D1-backed POS is live."
              exit 0
            fi
            sleep 6
          done
          echo 'Central POS not confirmed on Cloudflare Pages Production.' >&2
          exit 1

