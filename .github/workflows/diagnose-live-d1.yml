name: Diagnose live D1 product listing
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-live-d1.yml'
jobs:
  product-page:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live product list without exposing private data
        run: |
          node <<'NODE'
          const root='https://hizlisatis.pages.dev/api/product-state';
          let deployed=false;
          for(let attempt=1;attempt<=15;attempt++){
            try{
              const html=await (await fetch('https://hizlisatis.pages.dev/index.html',
                {signal:AbortSignal.timeout(12000)})).text();
              const api=await (await fetch(root+'?after=',{
                signal:AbortSignal.timeout(12000)})).json();
              const htmlReady=html.includes('Mobil POS · v3.4.1');
              const serverReady=api.expected===19096 && api.products?.length===1000;
              console.log(JSON.stringify({attempt,htmlReady,serverReady,
                apiExpected:api.expected||null,pageSize:api.products?.length||null}));
              if(htmlReady&&serverReady){deployed=true;break}
            }catch(e){console.log('deploy check',attempt,String(e.message||e))}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!deployed){console.error('Mobile D1 v3.4.1 not confirmed on Production');process.exit(1)}
          let cursor='',total=0;
          for(let page=0;page<40;page++){
            try{
              const response=await fetch(root+'?after='+encodeURIComponent(cursor),{
                signal:AbortSignal.timeout(20000)});
              const txt=await response.text();
              let data=null;try{data=JSON.parse(txt)}catch{}
              const n=Array.isArray(data?.products)?data.products.length:null;
              total+=n||0;
              console.log(JSON.stringify({page:page+1,status:response.status,
                bytes:new TextEncoder().encode(txt).length,items:n,total,
                hasNext:Boolean(data?.next),error:data?.error||null}));
              if(!response.ok||n===null)process.exit(1);
              if(!data.next){console.log('Total fetched '+total);process.exit(total>=19096?0:1)}
              if(data.next===cursor){console.log('Repeated cursor');process.exit(1)}
              cursor=data.next;
            }catch(e){console.log(JSON.stringify({page:page+1,error:String(e?.message||e)}));process.exit(1)}
          }
          process.exit(1);
          NODE
