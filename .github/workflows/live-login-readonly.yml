name: Live login read-only verification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/live-login-readonly.yml']
permissions:
  contents: read
jobs:
  probe-login-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public login endpoints without credentials
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const hosts=['https://hizlisatis.pages.dev','https://hizlisatis.tolgamy.workers.dev'];
          const checks=[];
          for(const host of hosts) {
            for(const path of ['/api/auth','/sw.js']) {
              try {
                const res=await fetch(host+path,{signal:AbortSignal.timeout(12000),redirect:'follow'});
                const body=await res.text();
                const type=(res.headers.get('content-type')||'').toLowerCase();
                let enabled=null,configured=null;
                if(path==='/api/auth'&&type.includes('application/json')){
                  try{const obj=JSON.parse(body);enabled=obj.enabled??null;configured=obj.configured??null}catch{}
                }
                checks.push({host,path,status:res.status,
                  contentType:type.split(';')[0],loginIsJSON:path==='/api/auth'?type.includes('application/json'):null,
                  enabled,configured,loginShell:path==='/sw.js'?body.includes('login-safe-v57'):null});
              } catch(error){checks.push({host,path,error:String(error.message).slice(0,120)})}
            }
          }
          console.log('LIVE_LOGIN_HOST_COMPARISON='+JSON.stringify(checks));
          JS
