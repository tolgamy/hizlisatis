name: Prepare category-specific CC0 photographs

on:
  push:
    branches:
      - feature/subcategory-photos-four-column-active-local
    paths:
      - scripts/download-subcategory-photos.mjs
  pull_request:
    branches:
      - main
    paths:
      - scripts/download-subcategory-photos.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  category-photos:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/subcategory-photos-four-column-active-local')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/subcategory-photos-four-column-active-local
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download CC0 photographs for every subcategory
        run: node scripts/download-subcategory-photos.mjs
      - name: Save photos back to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/subcategory-photos public/subcategory-photos.js
          if ! git diff --cached --quiet; then
            git commit -m "Add 86 locally hosted CC0 category photographs"
            git push
          fi
