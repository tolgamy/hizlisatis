name: Publish HızlıSatış to Cloudflare Pages
# Production deployment is a separate, operator-authorized action.
# An ordinary green CI run never implies a completed Cloudflare publication.
on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: "hizlisatis.pages.dev canlı yayınına gönderimi onaylıyorum"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: hizlisatis-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.production_approved == true }}
    name: Test, publish, verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Cloudflare publishing credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Cloudflare yayını için GitHub Actions secrets bölümünde CLOUDFLARE_ACCOUNT_ID ve CLOUDFLARE_API_TOKEN gerekli. Bu bilgileri asla kaynak koda veya sohbete koymayın."
            exit 1
          fi
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test production source
        run: npm test
      - name: Build PWA offline assets
        run: npm run build
      - name: Verify package and Cloudflare Pages Functions
        run: |
          test -s public/index.html
          test -s public/sw.js
          test -s public/vendor/html5-qrcode.min.js
          test -f functions/api/product-state.js
          test -f public/scale-serial.js
          grep -q 'cep-pos-shell-v48-windows-scale-manual-grams' public/sw.js
      - name: Publish to existing hizlisatis Pages project
        shell: bash
        run: |
          npx wrangler pages deploy public --project-name=hizlisatis --branch=main --commit-hash="$GITHUB_SHA"
      - name: Verify published PWA version and central D1
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            shell=$(curl --fail --silent --show-error --max-time 15 \
              -H 'Cache-Control: no-cache' "https://hizlisatis.pages.dev/sw.js?check=${GITHUB_SHA}" || true)
            response=$(curl --fail --silent --show-error --max-time 15 \
              -H 'Cache-Control: no-cache' "https://hizlisatis.pages.dev/api/product-state?health=1&check=${GITHUB_SHA}" || true)
            if [[ "$shell" == *"v48-windows-scale-manual-grams"* && "$response" == *'"ready":true'* ]]; then
              echo "v48 Cloudflare yayında ve merkezi D1 hazır."
              exit 0
            fi
            echo "Yayın kontrolü $attempt/12: PWA ve D1 yayına geçişi bekleniyor."
            sleep 5
          done
          echo "::error::Yayın komutu tamamlandı ama canlı v48 ve D1 beraber doğrulanamadı. Cloudflare Deployments ve Pages D1 bağlarını kontrol edin."
          exit 1
