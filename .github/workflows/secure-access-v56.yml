name: Secure login v56 – Focused Build and Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secure-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test secure access and current responsive layouts
        run: node --test tests/secure-access-v56.test.js tests/settings-main-menu-v55.test.js tests/large-categories-v56.test.js tests/login-form-no-leak-v57.test.js tests/desktop-redesign-v58.test.js tests/desktop-home-six-by-two-v59.test.js tests/desktop-views-v60.test.js tests/desktop-account-status-v61.test.js
      - name: Build
        run: npm run build
      - name: Verify new auth entrypoint and server functions
        run: |
          test -s public/auth-ui.js
          test -s lib/user-access.js
          test -s functions/api/auth.js
          test -s functions/api/users.js
          test -s functions/api/sale-access.js
          test -s public/vendor/html5-qrcode.min.js
