name: Verify final receipt print asset on live v3.5.0
on:
  pull_request:
    paths:
      - '.github/workflows/verify-final-thermal-v350.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify compact bold ESC POS code and catalog on live site
        run: |
          node <<'NODE'
          const base='https://hizlisatis.pages.dev';
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const [page,receipt,health]=await Promise.all([
                fetch(base+'/',{signal:AbortSignal.timeout(10000)}).then(r=>r.text()),
                fetch(base+'/receipt-share.js',{signal:AbortSignal.timeout(10000)}).then(r=>r.text()),
                fetch(base+'/api/product-state?health=1',{signal:AbortSignal.timeout(10000)}).then(r=>r.json())
              ]);
              const done=page.includes('Mobil POS · v3.5.0')&&
                receipt.includes('0x1b,0x40,0x1b,0x45,0x01,0x1b,0x33,0x18')&&
                health.ready===true&&health.count>=19096;
              console.log(JSON.stringify({attempt,version:page.includes('v3.5.0'),
                boldCompactReceipt:receipt.includes('0x1b,0x40,0x1b,0x45,0x01,0x1b,0x33,0x18'),
                count:health.count}));
              if(done)process.exit(0);
            }catch(error){console.log('Attempt '+attempt+' '+String(error.message||error))}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          process.exit(1);
          NODE
