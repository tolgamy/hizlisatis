name: Verify v3.5.0 public deployment without writing data
on:
  pull_request:
    paths:
      - '.github/workflows/verify-pos-v350.yml'
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live POS shell, 19,096 D1 products and private customers API
        run: |
          node <<'NODE'
          const base='https://hizlisatis.pages.dev';
          let done=false;
          for(let attempt=1;attempt<=36;attempt++){
            try{
              const [html,health,customers,ui,receipt,app]=await Promise.all([
                fetch(base+'/',{signal:AbortSignal.timeout(12000)}).then(r=>r.text()),
                fetch(base+'/api/product-state?health=1',{signal:AbortSignal.timeout(12000)}).then(r=>r.json()),
                fetch(base+'/api/customers',{signal:AbortSignal.timeout(12000)}),
                fetch(base+'/customer-ui.js',{signal:AbortSignal.timeout(12000)}),
                fetch(base+'/receipt-settings.js',{signal:AbortSignal.timeout(12000)}),
                fetch(base+'/app.js',{signal:AbortSignal.timeout(12000)}).then(r=>r.text())
              ]);
              const facts={version:html.includes('Mobil POS · v3.5.0'),
                catalog:health.ready===true&&health.count>=19096,
                productCount:health.count,
                customersDenied:customers.status===401,
                customerModule:ui.ok,receiptSettings:receipt.ok,
                cashModal:app.includes('function openCashPayment()'),
                quantityModal:app.includes('function selectScannedQuantity(')};
              console.log('Attempt '+attempt+' '+JSON.stringify(facts));
              if(facts.version&&facts.catalog&&facts.customersDenied&&facts.customerModule&&
                facts.receiptSettings&&facts.cashModal&&facts.quantityModal){done=true;break;}
            }catch(error){console.log('Attempt '+attempt+' error '+String(error.message||error))}
            await new Promise(resolve=>setTimeout(resolve,6000));
          }
          if(!done)process.exit(1);
          console.log('LIVE v3.5.0 verified without any product/customer writes.');
          NODE
