name: Audited Test Sale Cancellation
on:
  push:
    branches: [veyseliptal]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Verify audited cancellation and existing checkout safety
        run: node --test tests/audit-test-sale-void.test.js tests/pos-no-stock-limits.test.js tests/veridyen-central-sales.test.js tests/report-filters.test.js tests/report-ui-v81.test.js
      - name: Build application
        run: npm run build
