.preview-label{display:none}.demo-note{display:flex;gap:8px;align-items:center;justify-content:center;text-align:center;padding:7px 10px;color:#33516b;background:#e7f0fb;font-size:11px;font-weight:700}

@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

function introHTML(title,canBack){return `<div class="intro">${canBack?'<button type="button" class="step-back" data-action="back">‹ Geri</button>':''}<h2>${escap(title)}</h2></div>`}
function cardHTML(item,kind){return `<button class="category-card" type="button" data-action="${kind}" data-id="${escap(item.id)}"><span class="cat-emoji" aria-hidden="true">${item.icon}</span><span class="cat-title">${escap(item.name)}</span><span class="cat-count">${item.count||0} ürün</span></button>`}

if(state.stage==='sub')return introHTML(cat.name,true)+`<div class="subcategory-grid">${cat.subs.map(s=>cardHTML({...s,count:s.id==='all'?cat.count:(s.id==='firsat'?2:products.filter(p=>p.cat===cat.id&&p.sub===s.id).length)},'subcategory')).join('')}</div>`;
const sub=cat.subs.find(s=>s.id===state.subcategory);let arr=products.filter(p=>p.cat===cat.id&&(state.subcategory==='all'||p.sub===state.subcategory));if(state.subcategory==='firsat')arr=products.filter(p=>p.cat===cat.id).slice(0,2);
return listProducts(arr,cat.name+' › '+(sub?sub.name:'Tüm Ürünler'),true)}
function renderSearch(){return introHTML('Ürün Ara',false)+'<input type="search" id="modalSearch" class="search-in-modal" placeholder="Ürün adı veya barkod ara" aria-label="Ürünleri ara">'+'<div id="searchResults"></div>'}
function updateSearch(){const el=$('modalSearch');if(!el)return;const term=el.value.trim().toLocaleLowerCase('tr');const arr=products.filter(p=>p.name.toLocaleLowerCase('tr').includes(term));$('searchResults').innerHTML=listProducts(arr,term?`“${term}” için sonuçlar`:'Örnek Ürünler',false)}
function renderBulk(){return introHTML('Toplu Ürün Listesi',false)+'<p class="muted">Ürünleri listeden hızlıca satışa ekleyebilirsiniz.</p>'+products.map(p=>`<div class="bulk-row"><span class="bulk-icon">${p.icon}</span><span class="bulk-info"><strong>${escap(p.name)}</strong><span>${money.format(p.price)}</span></span><button class="smalladd" data-action="add" data-id="${p.id}">＋ Ekle</button></div>`).join('')}
function render(){ $('tabSearch').classList.toggle('active',state.tab==='search');$('tabCats').classList.toggle('active',state.tab==='cats');$('tabBulk').classList.toggle('active',state.tab==='bulk');$('sheetBody').innerHTML=state.tab==='cats'?renderCats():state.tab==='search'?renderSearch():renderBulk();if(state.tab==='search')updateSearch();$('sheetBody').scrollTop=0 }
function goBack(){if(state.tab!=='cats'){state.tab='cats';state.stage='main'}else if(state.stage==='products'){state.stage='sub'}else if(state.stage==='sub'){state.stage='main';state.category=null}else{closeModal();return}render()}
function addToCart(id){let p=products.find(x=>x.id===Number(id));if(!p)return;state.cart.set(p.id,(state.cart.get(p.id)||0)+1);renderCart();toast(`${p.name} sepete eklendi`)}
function renderCart(){let qty=0,total=0;let lines=[];for(const [id,n] of state.cart){const p=products.find(x=>x.id===id);if(!p)continue;qty+=n;total+=p.price*n;lines.push(`<div class="cart-line"><span class="cart-name">${p.icon} ${escap(p.name)}</span><span class="cart-qty">${n} ×</span><span class="money">${money.format(p.price*n)}</span></div>`)}$('cartList').innerHTML=lines.length?lines.join(''):'<div class="empty-cart">Henüz ürün eklenmedi.<br> <strong>Ürün Ekle</strong> butonundan başlayabilirsin.</div>';$('typeCount').textContent=`${state.cart.size} Çeşit`;$('totalCount').textContent=`${qty} Ürün`;$('itemSummary').textContent=`${qty} ürün`;$('cartTotal').textContent=money.format(total)}
$('sheetBody').addEventListener('click',ev=>{const btn=ev.target.closest('button[data-action]');if(!btn)return;const a=btn.dataset.action,id=btn.dataset.id;if(a==='category'){state.category=id;state.stage='sub';render()}else if(a==='subcategory'){state.subcategory=id;state.stage='products';render()}else if(a==='back')goBack();else if(a==='add')addToCart(id)});
$('sheetBody').addEventListener('input',e=>{if(e.target&&e.target.id==='modalSearch')updateSearch()});
$('tabSearch').onclick=()=>{state.tab='search';render()};$('tabCats').onclick=()=>{state.tab='cats';render()};$('tabBulk').onclick=()=>{state.tab='bulk';render()};
$('openProducts').onclick=()=>{state.tab='cats';state.stage='main';openModal()};$('closeSheet').onclick=closeModal;$('dim').onclick=closeModal;
$('headBack').onclick=()=>{if(!$('sheet').hidden)goBack();else openModal()};$('salesBtn').onclick=openModal;$('closeTop').onclick=()=>{if(!$('sheet').hidden)closeModal();else toast('Satış listesi ekranda')};
$('cancelBtn').onclick=()=>{if(state.cart.size===0){toast('Sepet zaten boş');return}if(confirm('Satış listesindeki tüm ürünler kaldırılsın mı?')){state.cart.clear();renderCart();toast('Satış listesi temizlendi')}};
$('barcodeBtn').onclick=()=>{state.tab='search';openModal();setTimeout(()=>{const inp=$('modalSearch');if(inp)inp.focus()},70)};
$('toolbarSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.tab='search';openModal();const q=$('toolbarSearch').value;$('modalSearch').value=q;updateSearch()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeModal()});
renderCart();render();
})();
</script>
</body>
</html>
